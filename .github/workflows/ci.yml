name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  mypy:
    name: mypy (agents + api + mcp_server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install mypy
      - run: mypy agents api mcp_server.py

  test-locked:
    name: test (locked, py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install pytest pytest-cov hypothesis
      - name: Run pytest with coverage gate
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80 tests/
        env:
          OPENAI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  test-compat:
    name: test (compat, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest hypothesis
      - run: pytest -v tests/
        env:
          OPENAI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
